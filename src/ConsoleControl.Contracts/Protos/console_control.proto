syntax = "proto3";

option csharp_namespace = "ConsoleControl.Contracts";

package consolecontrol.v1;

service ConsoleControlService {
  rpc GetStatus (GetStatusRequest) returns (GetStatusReply);
  rpc Control (stream ControlStreamRequest) returns (stream ControlStreamEvent);
  rpc GetVideoInventory (GetVideoInventoryRequest) returns (VideoInventoryReply);
  rpc SelectVideoSource (SelectVideoSourceRequest) returns (VideoSelectionReply);
  rpc GetControllerBridgeInventory (GetControllerBridgeInventoryRequest) returns (ControllerBridgeInventoryReply);
  rpc SelectControllerBridge (SelectControllerBridgeRequest) returns (ControllerBridgeSelectionReply);
  rpc GetScreenshot (GetScreenshotRequest) returns (ScreenshotReply);
  rpc RunAutomation (RunAutomationRequest) returns (AutomationResultReply);
  rpc DeclineControlRequest (DeclineControlRequestMessage) returns (DeclineControlRequestReply);
}

message GetScreenshotRequest {}

message ScreenshotReply {
  uint64 generation = 1;
  uint64 sequence = 2;
  VideoModeMessage mode = 3;
  int64 received_at_unix_ms = 4;
  bytes jpeg = 5;
}

message AutomationPressMessage {
  CanonicalDigitalControl control = 1;
  uint32 duration_ms = 2;
}

message AutomationHoldMessage {
  CanonicalDigitalControl control = 1;
  uint32 duration_ms = 2;
}

message AutomationCaptureMessage { string name = 1; }

message AutomationCommandMessage {
  oneof body {
    AutomationPressMessage press = 1;
    AutomationHoldMessage hold = 2;
    uint32 pause_ms = 3;
    AutomationCaptureMessage capture = 4;
  }
}

message RunAutomationRequest {
  string client_id = 1;
  uint64 lease_generation = 2;
  bool capture_start = 3;
  repeated AutomationCommandMessage commands = 4;
  bool capture_end = 5;
}

enum AutomationOutcomeMessage {
  AUTOMATION_OUTCOME_MESSAGE_UNSPECIFIED = 0;
  AUTOMATION_OUTCOME_MESSAGE_COMPLETED = 1;
  AUTOMATION_OUTCOME_MESSAGE_PREEMPTED = 2;
  AUTOMATION_OUTCOME_MESSAGE_CANCELLED = 3;
  AUTOMATION_OUTCOME_MESSAGE_BRIDGE_UNAVAILABLE = 4;
  AUTOMATION_OUTCOME_MESSAGE_SCREENSHOT_FAILED = 5;
}

message AutomationCaptureReply {
  string name = 1;
  uint32 scheduled_at_ms = 2;
  uint32 actual_at_ms = 3;
  optional ScreenshotReply screenshot = 4;
  optional string failure = 5;
}

message AutomationResultReply {
  AutomationOutcomeMessage outcome = 1;
  uint32 elapsed_ms = 2;
  repeated AutomationCaptureReply captures = 3;
  optional string detail = 4;
}

message GetVideoInventoryRequest {}

message VideoModeMessage {
  uint32 width = 1;
  uint32 height = 2;
  uint32 frames_per_second = 3;
}

message VideoSourceMessage {
  string id = 1;
  string display_name = 2;
  VideoModeMessage preferred_mode = 3;
}

message VideoInventoryReply {
  repeated VideoSourceMessage sources = 1;
  optional string selected_source_id = 2;
  uint64 revision = 3;
  string live_stream_uri = 4;
  string status = 5;
}

message SelectVideoSourceRequest {
  string source_id = 1;
  uint64 expected_revision = 2;
}

message VideoSelectionReply {
  string source_id = 1;
  uint64 revision = 2;
  string status = 3;
}

message GetControllerBridgeInventoryRequest {}

message ControllerBridgeMessage {
  string id = 1;
  string display_name = 2;
  bool connected = 3;
}

message ControllerBridgeInventoryReply {
  repeated ControllerBridgeMessage bridges = 1;
  optional string selected_bridge_id = 2;
  uint64 revision = 3;
  ControllerBridgeStateMessage state = 4;
  string status = 5;
}

message SelectControllerBridgeRequest {
  string bridge_id = 1;
  uint64 expected_revision = 2;
}

message ControllerBridgeSelectionReply {
  string bridge_id = 1;
  uint64 revision = 2;
  ControllerBridgeStateMessage state = 3;
  string status = 4;
}

enum ControllerBridgeStateMessage {
  CONTROLLER_BRIDGE_STATE_MESSAGE_UNSPECIFIED = 0;
  CONTROLLER_BRIDGE_STATE_MESSAGE_SELECTION_REQUIRED = 1;
  CONTROLLER_BRIDGE_STATE_MESSAGE_UNAVAILABLE = 2;
  CONTROLLER_BRIDGE_STATE_MESSAGE_DISCONNECTED = 3;
  CONTROLLER_BRIDGE_STATE_MESSAGE_READY = 4;
  CONTROLLER_BRIDGE_STATE_MESSAGE_FAULTED = 5;
}

message GetStatusRequest { string client_id = 1; }

message GetStatusReply {
  string daemon_version = 1;
  uint32 protocol_version = 2;
  ControlOwnerMessage control_owner = 3;
  ControllerBridgeStatusMessage controller_bridge = 4;
  VideoCaptureStatusMessage video = 5;
  optional string pending_control_request_id = 6;
  optional string pending_control_request_reason = 7;
}

enum ControlOwnerMessage {
  CONTROL_OWNER_MESSAGE_UNSPECIFIED = 0;
  CONTROL_OWNER_MESSAGE_NONE = 1;
  CONTROL_OWNER_MESSAGE_THIS_CLIENT = 2;
  CONTROL_OWNER_MESSAGE_INTERACTIVE_CLIENT = 3;
  CONTROL_OWNER_MESSAGE_AUTOMATION_CLIENT = 4;
}

enum HardwareAvailabilityMessage {
  HARDWARE_AVAILABILITY_MESSAGE_UNSPECIFIED = 0;
  HARDWARE_AVAILABILITY_MESSAGE_UNKNOWN = 1;
  HARDWARE_AVAILABILITY_MESSAGE_AVAILABLE = 2;
  HARDWARE_AVAILABILITY_MESSAGE_UNAVAILABLE = 3;
}

enum ControllerOutputConnectionMessage {
  CONTROLLER_OUTPUT_CONNECTION_MESSAGE_UNSPECIFIED = 0;
  CONTROLLER_OUTPUT_CONNECTION_MESSAGE_NOT_CONFIGURED = 1;
  CONTROLLER_OUTPUT_CONNECTION_MESSAGE_DISCONNECTED_UNTIL_INPUT = 2;
  CONTROLLER_OUTPUT_CONNECTION_MESSAGE_CONNECTED = 3;
  CONTROLLER_OUTPUT_CONNECTION_MESSAGE_FAULTED = 4;
}

message ControllerBridgeStatusMessage {
  optional string selected_bridge_id = 1;
  HardwareAvailabilityMessage availability = 2;
  ControllerOutputConnectionMessage output_connection = 3;
  string detail = 4;
  optional int64 last_inventory_at_unix_ms = 5;
}

enum VideoCaptureStateMessage {
  VIDEO_CAPTURE_STATE_MESSAGE_UNSPECIFIED = 0;
  VIDEO_CAPTURE_STATE_MESSAGE_SELECTION_REQUIRED = 1;
  VIDEO_CAPTURE_STATE_MESSAGE_STARTING = 2;
  VIDEO_CAPTURE_STATE_MESSAGE_STREAMING = 3;
  VIDEO_CAPTURE_STATE_MESSAGE_RECONNECTING = 4;
  VIDEO_CAPTURE_STATE_MESSAGE_FAULTED = 5;
}

message VideoCaptureStatusMessage {
  optional string selected_source_id = 1;
  HardwareAvailabilityMessage availability = 2;
  VideoCaptureStateMessage capture_state = 3;
  optional VideoModeMessage active_mode = 4;
  optional int64 latest_frame_at_unix_ms = 5;
  string detail = 6;
}

message OpenControlStream {
  string client_id = 1;
  ControlPriority priority = 2;
  optional string request_reason = 3;
}

message DeclineControlRequestMessage { string request_id = 1; }
message DeclineControlRequestReply { bool declined = 1; }

message ControlGranted {
  uint64 lease_generation = 1;
}

message ControllerStateMessage {
  uint32 buttons = 1;
  uint32 dpad = 2;
  uint32 left_stick_x = 3;
  uint32 left_stick_y = 4;
  uint32 right_stick_x = 5;
  uint32 right_stick_y = 6;
  uint32 left_trigger = 7;
  uint32 right_trigger = 8;
}

message ControlStreamRequest {
  oneof body {
    OpenControlStream open = 1;
    ControllerStateMessage state = 2;
    ControlHeartbeat heartbeat = 3;
  }
}

message ControlHeartbeat {}

message ControlStreamEvent {
  oneof body {
    ControlGranted granted = 1;
    ControlCondition condition = 2;
  }
}

enum ControlCondition {
  CONTROL_CONDITION_UNSPECIFIED = 0;
  CONTROL_CONDITION_BRIDGE_UNAVAILABLE = 1;
  CONTROL_CONDITION_LEASE_REVOKED = 2;
}

enum CanonicalDigitalControl {
  CANONICAL_DIGITAL_CONTROL_UNSPECIFIED = 0;
  CANONICAL_DIGITAL_CONTROL_A = 1;
  CANONICAL_DIGITAL_CONTROL_B = 2;
  CANONICAL_DIGITAL_CONTROL_X = 3;
  CANONICAL_DIGITAL_CONTROL_Y = 4;
  CANONICAL_DIGITAL_CONTROL_LEFT_SHOULDER = 5;
  CANONICAL_DIGITAL_CONTROL_RIGHT_SHOULDER = 6;
  CANONICAL_DIGITAL_CONTROL_LEFT_TRIGGER = 7;
  CANONICAL_DIGITAL_CONTROL_RIGHT_TRIGGER = 8;
  CANONICAL_DIGITAL_CONTROL_MINUS = 9;
  CANONICAL_DIGITAL_CONTROL_PLUS = 10;
  CANONICAL_DIGITAL_CONTROL_HOME = 11;
  CANONICAL_DIGITAL_CONTROL_CAPTURE = 12;
  CANONICAL_DIGITAL_CONTROL_DPAD_UP = 13;
  CANONICAL_DIGITAL_CONTROL_DPAD_RIGHT = 14;
  CANONICAL_DIGITAL_CONTROL_DPAD_DOWN = 15;
  CANONICAL_DIGITAL_CONTROL_DPAD_LEFT = 16;
  CANONICAL_DIGITAL_CONTROL_LEFT_STICK_CLICK = 17;
  CANONICAL_DIGITAL_CONTROL_RIGHT_STICK_CLICK = 18;
}

enum ControlPriority {
  CONTROL_PRIORITY_UNSPECIFIED = 0;
  CONTROL_PRIORITY_AUTOMATION = 1;
  CONTROL_PRIORITY_INTERACTIVE_USER = 2;
}
