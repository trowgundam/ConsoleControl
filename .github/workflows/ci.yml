name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Validate desktop applications
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.111

      - name: Restore dependencies
        run: dotnet restore ConsoleControl.slnx --locked-mode

      - name: Verify C# formatting
        run: dotnet format ConsoleControl.slnx --no-restore --verify-no-changes

      - name: Build and run integration checks
        run: tools/verify-desktop-slice.sh

      - name: Check shell scripts
        run: shellcheck tools/*.sh

  package-linux-x64:
    name: Package Linux x64 applications
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.111

      - name: Read release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix." >&2
              exit 1
            fi
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Linux runtime assets
        run: dotnet restore ConsoleControl.slnx --runtime linux-x64 --locked-mode

      - name: Assemble portable archive
        run: tools/package-linux-release.sh "${{ steps.version.outputs.value }}" artifacts/release

      - name: Smoke-test portable archive
        run: tools/test-linux-release.sh "artifacts/release/ConsoleControl-${{ steps.version.outputs.value }}-linux-x64.tar.gz"

      - name: Upload desktop archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  validate-controller-firmware:
    name: Validate controller firmware
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: ./.github/workflows/firmware.yml

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-linux-x64
      - validate-controller-firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate combined checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            "${release_args[@]}"
